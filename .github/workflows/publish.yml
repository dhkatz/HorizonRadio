name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach artifacts to.
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish release asset
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ilammy/msvc-dev-cmd exports Platform=x64, which dotnet promotes to
      # a global MSBuild property and `dotnet publish` of the .slnx then
      # fails with MSB4126 "Release|x64 is invalid" (the C# projects only
      # define AnyCPU). cmake + Ninja ignore Platform, so clearing it is
      # safe for the C++ build.
      - name: Clear MSVC Platform var (breaks dotnet on the .slnx)
        shell: pwsh
        run: '"Platform=" >> $env:GITHUB_ENV'

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = '${{ inputs.tag }}'
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw 'Release tag could not be resolved.'
          }
          $safeTag = $tag -replace '[^A-Za-z0-9_.-]', '-'
          # Drop a leading 'v' from the in-binary Version property so
          # AssemblyVersion stays a plain SemVer string ("1.0.0",
          # not "v1.0.0"). The asset filename keeps the original tag.
          $semver = $tag -replace '^v', ''
          "tag=$tag"          >> $env:GITHUB_OUTPUT
          "safe_tag=$safeTag" >> $env:GITHUB_OUTPUT
          "semver=$semver"    >> $env:GITHUB_OUTPUT

      - name: Configure CMake
        run: cmake --preset windows-x64

      # Builds version.dll into build/Release/. The HorizonRadio.UI
      # csproj's <None Include> item picks it up automatically and copies
      # it into the UI's publish output. Tools (incl. librespot) are not
      # bundled — they install on demand from the Tools tab.
      - name: Build C++ side (Release, x64)
        run: cmake --build --preset windows-x64-release

      - name: Run C++ tests
        run: ctest --preset windows-x64-release

      # Self-contained publish so end users don't need a separate
      # .NET runtime install. The csproj's ZipPublishOutput target
      # fires automatically after Publish and drops a zip into
      # build/release/HorizonRadio.zip — that zip is what we upload.
      - name: Publish UI + create zip
        run: >
          dotnet publish HorizonRadio.UI/HorizonRadio.UI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.release.outputs.semver }}
          -p:Channel=stable

      - name: Rename zip with release tag
        id: archive
        shell: pwsh
        run: |
          $safeTag = '${{ steps.release.outputs.safe_tag }}'
          $src = 'build/release/HorizonRadio.zip'
          $dst = "build/release/HorizonRadio-$safeTag.zip"
          Move-Item $src $dst -Force
          "zip=$dst" >> $env:GITHUB_OUTPUT

      - name: Attach archive to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ steps.release.outputs.tag }}' '${{ steps.archive.outputs.zip }}' --clobber

      # version.dll is also attached as a standalone asset (it's bundled
      # in the zip too, but a loose copy helps manual Mods-tab installs).
      # librespot is NOT attached here — it lives in the `tools` blobstore
      # (publish-tools.yml) and installs on demand from the Tools tab.
      - name: Attach version.dll to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ steps.release.outputs.tag }}' 'build/Release/version.dll' --clobber
