name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build + test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify C# formatting
        run: dotnet format HorizonRadio.UI.slnx --verify-no-changes --verbosity minimal

      - name: Build librespot
        id: librespot
        uses: ./.github/actions/build-librespot

      - name: Configure CMake (Debug)
        run: cmake --preset windows-x64

      - name: Build C++ side (Debug, x64)
        run: cmake --build --preset windows-x64-debug

      - name: Run C++ tests
        run: ctest --preset windows-x64-debug

      # C# side runs second so the C++ outputs (version.dll +
      # librespot.exe) are already on disk by the time the UI's
      # <None Include> items try to pick them up.
      - name: Build C# UI
        run: dotnet build HorizonRadio.UI.slnx -c Debug --nologo

      - name: Upload version.dll artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-dll
          path: build/Debug/version.dll
          if-no-files-found: error

      - name: Upload librespot.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: librespot-exe
          path: build/librespot/librespot.exe
          if-no-files-found: error
